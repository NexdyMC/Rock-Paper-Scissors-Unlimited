  <script>
  // =========================================================================
  // BAGIAN 1: KONFIGURASI MULTI-PROVIDER JURI AI (Gemini + Groq)
  // =========================================================================
  // ⬇️⬇️⬇️ MASUKKAN 3 API KEY ANDA DI SINI ⬇️⬇️⬇️
  // Urutan providers = urutan prioritas pertama kali dicoba (selama semuanya
  // sedang "bebas"/tidak sibuk). Kalau salah satu sibuk (503/429), otomatis
  // dilewati dan dicoba provider berikutnya di daftar ini.
  const PROVIDERS = [
    { id: "gemini",  label: "Gemini",        type: "gemini", apiKey: "MASUKKAN_API_KEY_GOOGLE_DI_SINI", model: "gemini-2.5-flash-lite" },
    { id: "groq-1",  label: "Groq (Key 1)",  type: "groq",   apiKey: "MASUKKAN_API_KEY_GROQ_1_DI_SINI", model: "openai/gpt-oss-120b" },
    { id: "groq-2",  label: "Groq (Key 2)",  type: "groq",   apiKey: "MASUKKAN_API_KEY_GROQ_2_DI_SINI", model: "openai/gpt-oss-120b" },
  ];

  // =========================================================================
  // Sistem "cooldown" berbasis localStorage: saat sebuah provider ketahuan
  // sibuk (503/429/500), kita simpan waktu "boleh dicoba lagi" untuknya, jadi
  // ronde berikutnya otomatis melewati provider itu dulu tanpa perlu menunggu
  // errornya lagi. Tombol sampah di pojok atas menghapus status ini.
  // =========================================================================
  const COOLDOWN_KEY = "bgku_ai_cooldowns";
  const COOLDOWN_DURATION_MS = 90 * 1000; // provider dianggap "sibuk" selama 90 detik

  function getCooldowns() {
    try {
      const raw = localStorage.getItem(COOLDOWN_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }
  function saveCooldowns(obj) {
    try { localStorage.setItem(COOLDOWN_KEY, JSON.stringify(obj)); } catch (e) { /* localStorage tidak tersedia, abaikan */ }
  }
  function markProviderBusy(providerId) {
    const cds = getCooldowns();
    cds[providerId] = Date.now() + COOLDOWN_DURATION_MS;
    saveCooldowns(cds);
  }
  function clearProviderBusy(providerId) {
    const cds = getCooldowns();
    if (cds[providerId]) {
      delete cds[providerId];
      saveCooldowns(cds);
    }
  }
  function clearAllCooldowns() {
    try { localStorage.removeItem(COOLDOWN_KEY); } catch (e) { /* abaikan */ }
  }

  // Susun urutan providers: yang sedang "bebas" duluan, yang sedang cooldown
  // ditaruh di belakang (diurutkan dari yang paling cepat selesai cooldown-nya)
  // sebagai jaga-jaga terakhir kalau semua provider lain ikut gagal.
  function getProviderOrder() {
    const cds = getCooldowns();
    const now = Date.now();
    const free = PROVIDERS.filter((p) => !(cds[p.id] && cds[p.id] > now));
    const busy = PROVIDERS
      .filter((p) => cds[p.id] && cds[p.id] > now)
      .sort((a, b) => cds[a.id] - cds[b.id]);
    return [...free, ...busy];
  }

  // =========================================================================
  // Sistem "skor kekuatan" (power score) berbasis localStorage: setiap nama
  // yang pernah dinilai AI disimpan skornya (1-100). Kalau KEDUA nama yang
  // bertarung di suatu ronde sama-sama sudah pernah tercatat, game langsung
  // membandingkan skornya secara instan TANPA memanggil AI sama sekali.
  // Kalau salah satu/kedua nama masih baru, AI tetap dipanggil seperti biasa
  // sambil sekalian diminta memberi skor untuk nama yang belum tercatat.
  // =========================================================================
  const POWER_SCORE_KEY = "bgku_power_scores";

  function getPowerScores() {
    try {
      const raw = localStorage.getItem(POWER_SCORE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }
  function savePowerScores(obj) {
    try { localStorage.setItem(POWER_SCORE_KEY, JSON.stringify(obj)); } catch (e) { /* abaikan */ }
  }
  function getStoredScore(name) {
    const scores = getPowerScores();
    const value = scores[name.trim().toLowerCase()];
    return typeof value === "number" && !isNaN(value) ? value : null;
  }
  function setStoredScore(name, value) {
    const scores = getPowerScores();
    scores[name.trim().toLowerCase()] = value;
    savePowerScores(scores);
  }
  function clearAllPowerScores() {
    try { localStorage.removeItem(POWER_SCORE_KEY); } catch (e) { /* abaikan */ }
  }

  // ---- Pemanggil masing-masing jenis provider (mengembalikan teks mentah) ----
  async function callGemini(provider, prompt) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${provider.model}:generateContent?key=${provider.apiKey}`;
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
    });
    const data = await response.json();
    if (!response.ok) {
      const err = new Error(data.error?.message || `${provider.label} error (status ${response.status})`);
      err.status = response.status;
      throw err;
    }
    return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
  }

  async function callGroq(provider, prompt) {
    const url = "https://api.groq.com/openai/v1/chat/completions";
    const response = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${provider.apiKey}`
      },
      body: JSON.stringify({
        model: provider.model,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await response.json();
    if (!response.ok) {
      const err = new Error(data.error?.message || `${provider.label} error (status ${response.status})`);
      err.status = response.status;
      throw err;
    }
    return data.choices?.[0]?.message?.content || "";
  }

  async function callProvider(provider, prompt) {
    return provider.type === "gemini" ? callGemini(provider, prompt) : callGroq(provider, prompt);
  }

  /**
   * getJuryDecision(challenger1, challenger2)
   * Kalau kedua nama sudah punya skor kekuatan tersimpan -> putuskan instan
   * tanpa panggil AI. Kalau belum, panggil AI seperti biasa (dengan fallback
   * antar-provider) sekaligus minta AI memberi skor untuk nama yang baru.
   * Mengembalikan Promise -> { winner: string, reason: string, providerLabel: string }
   */
  async function getJuryDecision(challenger1, challenger2) {
    // ---- Cek dulu: kalau KEDUA nama sudah pernah tercatat, putuskan instan ----
    const knownScore1 = getStoredScore(challenger1);
    const knownScore2 = getStoredScore(challenger2);

    if (knownScore1 !== null && knownScore2 !== null) {
      const winner =
        knownScore1 === knownScore2
          ? (Math.random() < 0.5 ? challenger1 : challenger2)
          : (knownScore1 > knownScore2 ? challenger1 : challenger2);
      const reason =
        `Keputusan instan dari data tersimpan: ${challenger1} (skor ${knownScore1}) ` +
        `vs ${challenger2} (skor ${knownScore2}). Skor lebih tinggi menang!`;
      return { winner, reason, providerLabel: "Data Tersimpan (Lokal)" };
    }

    // ---- Kalau salah satu/kedua nama masih baru, tetap tanya AI ----
    const prompt =
      `Kamu adalah "Juri AI" dalam game "Batu Gunting Kertas Unlimited". ` +
      `Dua kandidat bertarung: "${challenger1}" melawan "${challenger2}". ` +
      `Tentukan siapa pemenangnya secara kreatif (boleh logis, boleh absurd/lucu, ` +
      `seperti dalam permainan anak-anak "apa saja vs apa saja"). ` +
      `Selain itu, beri juga "skor kekuatan" 1-100 untuk MASING-MASING kandidat ` +
      `(semakin kuat/dominan sesuatu, semakin tinggi skornya). ` +
      `Balas HANYA dengan JSON valid tanpa markdown/backtick, format persis: ` +
      `{"winner": "<salah satu dari kedua nama persis seperti input>", ` +
      `"reason": "<alasan singkat, maksimal 2 kalimat, dengan gaya lucu>", ` +
      `"power1": <angka 1-100 untuk "${challenger1}">, ` +
      `"power2": <angka 1-100 untuk "${challenger2}">}`;

    const order = getProviderOrder();
    let lastError = null;

    for (const provider of order) {
      try {
        const rawFromProvider = await callProvider(provider, prompt);
        const rawText = rawFromProvider.replace(/```json|```/g, "").trim();

        let parsed;
        try {
          parsed = JSON.parse(rawText);
        } catch (e) {
          throw new Error(`${provider.label} membalas dengan format yang tidak terbaca.`);
        }

        if (!parsed.winner || !parsed.reason) {
          throw new Error(`Format respons ${provider.label} tidak sesuai.`);
        }

        // Validasi: pastikan pemenang memang salah satu dari dua kandidat.
        const w = parsed.winner.trim();
        const validWinner =
          w.toLowerCase() === challenger1.toLowerCase() ? challenger1 :
          w.toLowerCase() === challenger2.toLowerCase() ? challenger2 :
          (Math.random() < 0.5 ? challenger1 : challenger2); // fallback jika AI meleset format

        // Simpan skor kekuatan HANYA untuk nama yang belum pernah tercatat,
        // supaya skor yang sudah ada tidak berubah-ubah tiap ronde (konsisten).
        if (knownScore1 === null) {
          const p1 = Number(parsed.power1);
          setStoredScore(challenger1, (!isNaN(p1) && p1 >= 1 && p1 <= 100) ? p1 : Math.floor(Math.random() * 100) + 1);
        }
        if (knownScore2 === null) {
          const p2 = Number(parsed.power2);
          setStoredScore(challenger2, (!isNaN(p2) && p2 >= 1 && p2 <= 100) ? p2 : Math.floor(Math.random() * 100) + 1);
        }

        clearProviderBusy(provider.id); // sukses -> provider ini terbukti sudah tidak sibuk
        return { winner: validWinner, reason: parsed.reason, providerLabel: provider.label };

      } catch (err) {
        lastError = err;
        // Hanya tandai "sibuk" untuk error yang bersifat sementara.
        const isTemporary = err.status === 503 || err.status === 429 || err.status === 500;
        if (isTemporary) {
          markProviderBusy(provider.id);
        }
        continue; // coba provider berikutnya di daftar
      }
    }

    throw lastError || new Error("Semua AI Juri sedang sibuk. Coba lagi sebentar lagi.");
  }

  /**
   * cekModelTersedia(providerId)
   * Fungsi bantu (opsional, khusus Gemini) untuk mengecek API key valid &
   * melihat daftar model yang bisa dipakai. Panggil dari console browser:
   *   cekModelTersedia("gemini")
   */
  async function cekModelTersedia(providerId = "gemini") {
    const provider = PROVIDERS.find((p) => p.id === providerId);
    if (!provider || provider.type !== "gemini") {
      console.error("cekModelTersedia hanya berlaku untuk provider bertipe Gemini.");
      return;
    }
    const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${provider.apiKey}`;
    try {
      const response = await fetch(url);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error?.message || "Gagal verifikasi");
      console.log("API Key valid. Model tersedia:", data.models.map((m) => m.name));
    } catch (err) {
      console.error("Cek model gagal:", err.message);
    }
  }

  // =========================================================================
  // BAGIAN 2: LOGIKA & STATE GAME (Vanilla JS, tanpa jQuery)
  // =========================================================================
  document.addEventListener("DOMContentLoaded", function () {
    let currentChampion = "Batu";
    let roundNumber = 1;
    let isProcessing = false;
    let dotsInterval = null;
    let typeInterval = null;

    // ---- Referensi elemen ----
    const htmlEl = document.documentElement;
    const themeToggleBtn = document.getElementById("themeToggle");
    const iconSun = document.getElementById("iconSun");
    const iconMoon = document.getElementById("iconMoon");
    const clearStatusBtn = document.getElementById("clearStatusBtn");
    const toast = document.getElementById("toast");
    let toastTimeout = null;

    const roundNumberEl = document.getElementById("roundNumber");
    const championCard = document.getElementById("championCard");
    const championText = document.getElementById("championText");
    const championScoreEl = document.getElementById("championScore");
    const vsBadge = document.getElementById("vsBadge");
    const challengerCard = document.getElementById("challengerCard");
    const battleForm = document.getElementById("battleForm");
    const challengerInput = document.getElementById("challengerInput");
    const challengerHint = document.getElementById("challengerHint");
    const attackBtn = document.getElementById("attackBtn");

    const loadingIndicator = document.getElementById("loadingIndicator");
    const dotsText = document.getElementById("dotsText");
    const verdictPanel = document.getElementById("verdictPanel");
    const verdictWinner = document.getElementById("verdictWinner");
    const verdictReason = document.getElementById("verdictReason");
    const verdictProvider = document.getElementById("verdictProvider");
    const historyLog = document.getElementById("historyLog");

    // ---- Toggle tema terang/gelap ----
    function updateThemeIcon() {
      const isDark = htmlEl.classList.contains("dark");
      iconSun.classList.toggle("hidden", !isDark);
      iconMoon.classList.toggle("hidden", isDark);
    }
    updateThemeIcon();

    themeToggleBtn.addEventListener("click", function () {
      htmlEl.classList.toggle("dark");
      updateThemeIcon();
    });

    // ---- Toast notifikasi singkat ----
    function showToast(message) {
      toast.textContent = message;
      toast.classList.remove("hidden", "animate-fade-in-up");
      void toast.offsetWidth; // reset animasi supaya bisa diputar ulang
      toast.classList.add("animate-fade-in-up");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.add("hidden"), 2200);
    }

    // ---- Tombol sampah: reset status "sibuk" AI + skor kekuatan tersimpan ----
    // Diberi konfirmasi karena tindakan ini menghapus data permanen (skor
    // kekuatan semua nama yang pernah tercatat), bukan cuma status sementara.
    clearStatusBtn.addEventListener("click", function () {
      const yakin = window.confirm(
        "Reset status AI sibuk (cooldown) DAN semua skor kekuatan (power score) yang tersimpan?\n\n" +
        "Semua nama yang pernah tercatat skornya akan dinilai ulang dari nol oleh AI. Tindakan ini tidak bisa dibatalkan."
      );
      if (!yakin) return;

      clearAllCooldowns();
      clearAllPowerScores();

      updateChampionScoreDisplay();
      updateChallengerHint();

      clearStatusBtn.classList.add("animate-shake");
      setTimeout(() => clearStatusBtn.classList.remove("animate-shake"), 500);
      showToast("Status AI & skor kekuatan sudah direset ✔");
    });

    // ---- Titik-titik animasi loading ----
    function startLoadingDots() {
      let count = 0;
      dotsText.textContent = "";
      dotsInterval = setInterval(function () {
        count = (count + 1) % 4;
        dotsText.textContent = ".".repeat(count);
      }, 400);
    }
    function stopLoadingDots() {
      clearInterval(dotsInterval);
      dotsText.textContent = "";
    }

    // ---- Efek mengetik (typewriter) untuk alasan juri ----
    function typeWriter(el, text, speed, callback) {
      el.textContent = "";
      el.classList.remove("typing-done");
      el.classList.add("typing-cursor");
      let i = 0;
      clearInterval(typeInterval);
      typeInterval = setInterval(function () {
        if (i < text.length) {
          el.textContent += text.charAt(i);
          i++;
        } else {
          clearInterval(typeInterval);
          el.classList.remove("typing-cursor");
          el.classList.add("typing-done");
          if (callback) callback();
        }
      }, speed);
    }

    // ---- Tambah entri ke log riwayat (pakai textContent agar aman dari injeksi HTML) ----
    function addHistory(champion, challenger, winner, reason, providerLabel) {
      const li = document.createElement("li");
      li.className = "border-l-2 border-slate-300 dark:border-slate-700 pl-3 py-1 animate-fade-in-up";

      const lineMain = document.createElement("div");
      lineMain.className = "text-sm text-slate-700 dark:text-slate-300";
      lineMain.textContent = `Ronde ${roundNumber}: ${champion} vs ${challenger} → ${winner} menang`;

      const lineReason = document.createElement("div");
      lineReason.className = "text-xs italic text-slate-400 dark:text-slate-500 font-mono";
      lineReason.textContent = `${reason} — dijawab oleh ${providerLabel}`;

      li.appendChild(lineMain);
      li.appendChild(lineReason);
      historyLog.prepend(li);
    }

    // ---- Tampilan skor kekuatan Juara Bertahan (dari localStorage, kalau ada) ----
    function updateChampionScoreDisplay() {
      const score = getStoredScore(currentChampion);
      championScoreEl.textContent = score !== null ? `⚡ Skor kekuatan: ${score}` : "";
    }
    updateChampionScoreDisplay(); // tampilkan status awal saat halaman dibuka

    // ---- Hint real-time saat mengetik: kasih tahu kalau nama sudah pernah tercatat ----
    function updateChallengerHint() {
      const val = challengerInput.value.trim();
      if (!val) {
        challengerHint.textContent = "";
        return;
      }
      const score = getStoredScore(val);
      challengerHint.textContent = score !== null ? `⚡ Tersimpan, skor: ${score}` : "";
    }
    challengerInput.addEventListener("input", updateChallengerHint);

    // ---- Reset tampilan sebelum ronde baru ----
    function resetCorners() {
      championCard.classList.remove("ring-4", "ring-gold");
      challengerCard.classList.remove("ring-4", "ring-gold");
    }

    // ---- Alur utama satu ronde pertarungan ----
    function startBattle(challenger) {
      isProcessing = true;
      resetCorners();
      attackBtn.disabled = true;

      // Cek lebih dulu: kalau kedua nama sudah punya skor tersimpan, hasilnya
      // akan instan (lihat getJuryDecision) -> loading & pulse VS dilewati
      // sepenuhnya, bukan cuma disembunyikan belakangan.
      const akanInstan = getStoredScore(currentChampion) !== null && getStoredScore(challenger) !== null;

      verdictPanel.classList.add("hidden");
      verdictPanel.classList.remove("animate-fade-in-up");

      if (!akanInstan) {
        vsBadge.classList.add("vs-fighting");
        loadingIndicator.classList.remove("hidden");
        startLoadingDots();
      }

      getJuryDecision(currentChampion, challenger)
        .then(function (result) {
          if (!akanInstan) {
            stopLoadingDots();
            vsBadge.classList.remove("vs-fighting");
            loadingIndicator.classList.add("hidden");
          }
          showVerdict(currentChampion, challenger, result);
        })
        .catch(function (err) {
          if (!akanInstan) {
            stopLoadingDots();
            vsBadge.classList.remove("vs-fighting");
            loadingIndicator.classList.add("hidden");
          }

          verdictWinner.textContent = "Gagal Menghubungi Juri AI";
          verdictReason.textContent = err.message || "Terjadi kesalahan tak terduga.";
          verdictProvider.textContent = "";
          verdictPanel.classList.remove("hidden");
          verdictPanel.classList.add("animate-fade-in-up");

          isProcessing = false;
          attackBtn.disabled = false;
        });
    }

    // ---- Menampilkan hasil keputusan juri lalu lanjut ke ronde berikutnya ----
    function showVerdict(champion, challenger, result) {
      const winner = result.winner;
      const challengerWins = winner.toLowerCase() === challenger.toLowerCase();

      verdictWinner.textContent = winner.toUpperCase() + " MENANG!";
      verdictProvider.textContent = `Dijawab oleh: ${result.providerLabel}`;

      if (challengerWins) {
        challengerCard.classList.add("ring-4", "ring-gold");
      } else {
        championCard.classList.add("ring-4", "ring-gold");
      }

      verdictPanel.classList.remove("hidden");
      verdictPanel.classList.add("animate-fade-in-up");

      typeWriter(verdictReason, result.reason, 22, function () {
        setTimeout(function () {
          addHistory(champion, challenger, winner, result.reason, result.providerLabel);

          currentChampion = winner;
          roundNumber++;

          roundNumberEl.textContent = roundNumber;
          championText.textContent = currentChampion.toUpperCase();
          updateChampionScoreDisplay();
          challengerInput.value = "";
          updateChallengerHint();
          resetCorners();

          isProcessing = false;
          attackBtn.disabled = false;
          challengerInput.focus();
        }, 1600);
      });
    }

    // ---- Handler submit form ----
    battleForm.addEventListener("submit", function (e) {
      e.preventDefault();
      if (isProcessing) return;

      const challenger = challengerInput.value.trim();
      if (!challenger) {
        challengerInput.classList.add("animate-shake");
        setTimeout(() => challengerInput.classList.remove("animate-shake"), 500);
        return;
      }

      attackBtn.classList.add("animate-shake");
      setTimeout(() => attackBtn.classList.remove("animate-shake"), 500);

      startBattle(challenger);
    });
  });
  </script>
</body>
